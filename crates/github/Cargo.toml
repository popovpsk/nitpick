[package]
name = "github"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
log = { workspace = true }
thiserror = "2"
http_client = { path = "../http_client" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
rstest = "0.28"

[lints]
workspace = true
