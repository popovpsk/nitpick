[package]
name = "nitpick"
version.workspace = true
edition.workspace = true
publish = false
authors = ["Aleksandr Popov <popov.psk@gmail.com>"]
description = "A side-by-side diff reviewer for huge merge requests"
homepage = "https://github.com/popovpsk/nitpick"
license = "MIT"

[[bin]]
name = "nitpick"
path = "src/main.rs"

[features]
default = ["self-update"]
self-update = ["updater/self-update"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component = { workspace = true, features = [
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-bash",
    "tree-sitter-proto",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-make",
    "tree-sitter-csharp",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-kotlin",
    "tree-sitter-swift",
    "tree-sitter-scala",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-lua",
    "tree-sitter-elixir",
    "tree-sitter-zig",
    "tree-sitter-graphql",
    "tree-sitter-cmake",
    "tree-sitter-diff",
    "tree-sitter-sql",
] }
diagnostics = { workspace = true }
log = { workspace = true }
anyhow.workspace = true
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
git_repo = { path = "../git_repo" }
forge = { path = "../forge" }
avatar_cache = { path = "../avatar_cache" }
review_core = { path = "../review_core" }
secret_store = { path = "../secret_store" }
net_runtime = { path = "../net_runtime" }
ui_resources = { path = "../ui_resources" }
updater = { path = "../updater", default-features = false }
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-cmake = "0.7"

[dev-dependencies]
rstest = "0.28"
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Nitpick"
identifier = "io.github.popovpsk.nitpick"
category = "DeveloperTool"
long-description = """
Nitpick is a native side-by-side diff reviewer for huge merge requests, \
with per-file "viewed" progress so a long review can be picked up where it \
was left.
"""
icons = [
    "../ui_resources/assets/app-icon/32x32.png",
    "../ui_resources/assets/app-icon/128x128.png",
    "../ui_resources/assets/app-icon/256x256.png",
    "../ui_resources/assets/app-icon/icon.icns",
    "../ui_resources/assets/app-icon/icon.ico",
]

[package.metadata.packager.deb]
section = "devel"
depends = [
    "libdbus-1-3",
    "libvulkan1",
    "libwayland-client0",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "fontconfig-config",
    "hicolor-icon-theme",
]

[package.metadata.packager.deb.files]
"../../LICENSE" = "/usr/share/doc/nitpick/copyright"

[package.metadata.packager.macos]
minimum-system-version = "10.15"
info-plist-path = "Info.plist"

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[lints]
workspace = true
