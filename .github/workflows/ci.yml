name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev libgit2-dev \
            build-essential cmake clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (portable build, updater compiled out)
        run: cargo clippy -p lgtm_ish --no-default-features --all-targets -- -D warnings

      - name: AUR template depends match the packager metadata
        run: |
          tmpl=$(grep '^depends=' packaging/aur/PKGBUILD.tmpl \
            | sed "s/^depends=(//; s/)$//; s/'//g" | tr ' ' '\n' | sed '/^$/d' | sort)
          toml=$(awk '
            /^\[package\.metadata\.packager\.pacman\]$/ { f = 1 }
            f && /^depends = \[/ { d = 1; next }
            d && /^\]/ { exit }
            d { gsub(/[",]/, ""); gsub(/^[ \t]+|[ \t]+$/, ""); if ($0 != "") print }
          ' crates/lgtm_ish/Cargo.toml | sort)
          if [ "$tmpl" != "$toml" ]; then
            echo "::error::packaging/aur/PKGBUILD.tmpl and [package.metadata.packager.pacman].depends disagree. The template is what reaches AUR users; the packager metadata only shapes the tarball's own generated PKGBUILD, which is discarded."
            diff <(echo "$toml") <(echo "$tmpl") || true
            exit 1
          fi
          echo "pacman depends in sync: $(echo "$tmpl" | tr '\n' ' ')"

  check-windows:
    name: Check (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
          - label: windows-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.label }}

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Check (portable build, updater compiled out)
        run: cargo check -p lgtm_ish --no-default-features --all-targets
