name: Download links

on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the download redirects
    runs-on: ubuntu-latest
    steps:
      - name: Write the site
        shell: bash
        run: |
          mkdir -p site/dl
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=https://github.com/popovpsk/nitpick">
          <title>Nitpick</title>
          <a href="https://github.com/popovpsk/nitpick">Nitpick on GitHub</a>
          HTML
          cat > site/dl/go.js <<'JS'
          const FALLBACK = "https://github.com/popovpsk/nitpick/releases/latest";
          const suffix = document.documentElement.dataset.asset;
          const go = (url) => location.replace(url);
          fetch("https://api.github.com/repos/popovpsk/nitpick/releases/latest", {
            headers: { Accept: "application/vnd.github+json" },
          })
            .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
            .then((release) => {
              const asset = (release.assets || []).find((a) => a.name.endsWith(suffix));
              go(asset ? asset.browser_download_url : FALLBACK);
            })
            .catch(() => go(FALLBACK));
          JS
          while IFS='|' read -r slug suffix; do
            [ -n "$slug" ] || continue
            mkdir -p "site/dl/$slug"
            cat > "site/dl/$slug/index.html" <<HTML
          <!doctype html>
          <html lang="en" data-asset="$suffix">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Downloading Nitpick</title>
          <noscript><meta http-equiv="refresh" content="0;url=https://github.com/popovpsk/nitpick/releases/latest"></noscript>
          <style>
            body{max-width:30rem;margin:0 auto;padding:4rem 1.25rem;
                 font:16px/1.6 system-ui,sans-serif;color:#1c1b1a;background:#e8e6e3}
            a{color:#0d6494}
            @media (prefers-color-scheme:dark){
              body{color:#e8e6e3;background:#1c1b1a}
              a{color:#56b4e3}}
          </style>
          <p>Fetching the latest Nitpick release&hellip;</p>
          <p><a href="https://github.com/popovpsk/nitpick/releases/latest">All downloads</a></p>
          <script src="../go.js"></script>
          HTML
            echo "dl/$slug -> *$suffix"
          done <<'SLUGS'
          macos-arm64|aarch64.dmg
          windows-x64|x64-setup.exe
          windows-arm64|arm64-installer.exe
          windows-x64-portable|x64-portable.zip
          windows-arm64-portable|arm64-portable.zip
          linux-x86_64-appimage|x86_64.AppImage
          linux-arm64-appimage|aarch64.AppImage
          linux-x86_64-deb|amd64.deb
          linux-arm64-deb|arm64.deb
          SLUGS

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
