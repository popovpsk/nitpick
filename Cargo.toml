[workspace]
resolver = "2"
members = [
    "crates/sloptaster",
    "crates/ui_resources",
    "crates/net_runtime",
    "crates/diagnostics",
    "crates/updater",
]

default-members = ["crates/sloptaster"]


[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = [
    "font-kit",
    "x11",
    "wayland",
] }
gpui-component = "=0.8.0"
anyhow = "1.0"
rust-embed = "8"
log = "0.4"
diagnostics = { path = "crates/diagnostics" }

[profile.release]
debug = false
lto = "thin"
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "forbid"
