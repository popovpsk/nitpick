[workspace]
resolver = "2"
members = [
    "crates/lgtm_ish",
    "crates/ui_resources",
    "crates/net_runtime",
    "crates/diagnostics",
    "crates/updater",
    "crates/http_client",
    "crates/git_repo",
    "crates/gitlab",
    "crates/github",
    "crates/forge",
    "crates/review_core",
    "crates/secret_store",
    "crates/zed_theme",
]

default-members = ["crates/lgtm_ish"]


[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "font-kit",
    "x11",
    "wayland",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "cf3e84bd367ef96678294153bece8cd7c52f0add" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "cf3e84bd367ef96678294153bece8cd7c52f0add" }
anyhow = "1.0"
rust-embed = "8"
log = "0.4"
diagnostics = { path = "crates/diagnostics" }

[profile.release]
debug = false
lto = "thin"
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "forbid"
