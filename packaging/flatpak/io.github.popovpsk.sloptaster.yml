id: io.github.popovpsk.sloptaster
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sloptaster

finish-args:
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --filesystem=home

modules:
  - name: sloptaster
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_NET_OFFLINE: 'true'
        CARGO_HOME: /run/build/sloptaster/cargo
    build-commands:
      - cargo build --release --offline -p sloptaster
      - install -Dm755 target/release/sloptaster /app/bin/sloptaster
      - install -Dm644 packaging/flatpak/io.github.popovpsk.sloptaster.desktop
        /app/share/applications/io.github.popovpsk.sloptaster.desktop
      - install -Dm644 packaging/flatpak/io.github.popovpsk.sloptaster.metainfo.xml
        /app/share/metainfo/io.github.popovpsk.sloptaster.metainfo.xml
      - install -Dm644 crates/ui_resources/assets/app-icon/32x32.png
        /app/share/icons/hicolor/32x32/apps/io.github.popovpsk.sloptaster.png
      - install -Dm644 crates/ui_resources/assets/app-icon/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.popovpsk.sloptaster.png
      - install -Dm644 crates/ui_resources/assets/app-icon/256x256.png
        /app/share/icons/hicolor/256x256/apps/io.github.popovpsk.sloptaster.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.popovpsk.sloptaster/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .github
          - target
          - build
          - repo
          - .flatpak-builder
      - cargo-sources.json
