id: io.github.popovpsk.lgtm-ish
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lgtm-ish

finish-args:
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --filesystem=home

modules:
  - name: lgtm-ish
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_NET_OFFLINE: 'true'
        CARGO_HOME: /run/build/lgtm-ish/cargo
    build-commands:
      - cargo build --release --offline -p lgtm_ish
      - install -Dm755 target/release/lgtm-ish /app/bin/lgtm-ish
      - install -Dm644 packaging/flatpak/io.github.popovpsk.lgtm-ish.desktop
        /app/share/applications/io.github.popovpsk.lgtm-ish.desktop
      - install -Dm644 packaging/flatpak/io.github.popovpsk.lgtm-ish.metainfo.xml
        /app/share/metainfo/io.github.popovpsk.lgtm-ish.metainfo.xml
      - install -Dm644 crates/ui_resources/assets/app-icon/32x32.png
        /app/share/icons/hicolor/32x32/apps/io.github.popovpsk.lgtm-ish.png
      - install -Dm644 crates/ui_resources/assets/app-icon/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.popovpsk.lgtm-ish.png
      - install -Dm644 crates/ui_resources/assets/app-icon/256x256.png
        /app/share/icons/hicolor/256x256/apps/io.github.popovpsk.lgtm-ish.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.popovpsk.lgtm-ish/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .github
          - target
          - build
          - repo
          - .flatpak-builder
      - cargo-sources.json
